name: Publish PowerShell Module
description: Publish a PowerShell module to the PowerShell Gallery for an exact release tag

inputs:
  module-path:
    description: Directory holding <root-module>.psm1, relative to the workspace
    required: true
  tag:
    description: Exact stable release tag, such as v1.2.3; prerelease tags are refused
    required: true
  api-key:
    description: API key for the repository
    required: true
  root-module:
    description: Module name; the module file is <root-module>.psm1 and the manifest <root-module>.psd1
    required: true
  description:
    description: Module description for the manifest
    required: true
  company-name:
    description: Company name for the manifest
    required: true
  author:
    description: Author for the manifest
    required: true
  release-notes:
    description: Release notes for the manifest, such as a link to the GitHub Release
    default: ''
  repository:
    description: PSResourceGet repository to publish to
    default: PSGallery

runs:
  using: composite
  steps:
    - name: Set up PowerShell
      uses: vhco-pro/setup-pwsh-action@a90bb078c3d694146ebc7c255404ac5057c85e2d # v0.1.0
    - name: Publish the module
      shell: pwsh
      env:
        PUBLISH_MODULE_PATH: ${{ inputs.module-path }}
        PUBLISH_TAG: ${{ inputs.tag }}
        PUBLISH_API_KEY: ${{ inputs.api-key }}
        PUBLISH_ROOT_MODULE: ${{ inputs.root-module }}
        PUBLISH_DESCRIPTION: ${{ inputs.description }}
        PUBLISH_COMPANY_NAME: ${{ inputs.company-name }}
        PUBLISH_AUTHOR: ${{ inputs.author }}
        PUBLISH_RELEASE_NOTES: ${{ inputs.release-notes }}
        PUBLISH_REPOSITORY: ${{ inputs.repository }}
      run: '& (Join-Path $env:GITHUB_ACTION_PATH ''scripts'' ''publish.ps1'')'

branding:
  icon: package
  color: blue
