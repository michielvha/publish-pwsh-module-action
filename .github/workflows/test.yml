name: Test

# The checks that must pass before release.yml tags. release.yml calls this
# workflow, so the checks are defined once.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format, analyze and test the scripts
        uses: vhco-pro/pwsh-ci-action@7b21017e8ec66c33deb3be79b7ad2b444c20fd33 # v0.1.0

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PowerShell
        uses: vhco-pro/setup-pwsh-action@a90bb078c3d694146ebc7c255404ac5057c85e2d # v0.1.0
      - name: Register a local test repository
        shell: pwsh
        run: ./tests/Register-TestRepository.ps1 -Name e2e -Path "$env:RUNNER_TEMP/feed"
      - name: Publish the fixture module
        uses: ./
        with:
          module-path: tests/fixture/Example
          tag: v0.0.1
          api-key: unused-for-a-local-repository
          root-module: Example
          description: Fixture module
          company-name: Example Company
          author: Example Author
          repository: e2e
      - name: Publish the same version again
        uses: ./
        with:
          module-path: tests/fixture/Example
          tag: v0.0.1
          api-key: unused-for-a-local-repository
          root-module: Example
          description: Fixture module
          company-name: Example Company
          author: Example Author
          repository: e2e
      - name: Check that pwsh steps run the pinned PowerShell
        shell: pwsh
        run: ./tests/Assert-PinnedPwsh.ps1
      - name: Check that the version was published once
        shell: pwsh
        run: ./tests/Assert-Published.ps1 -Repository e2e -Version 0.0.1
